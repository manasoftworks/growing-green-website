<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete your order — Growing Green</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta name="theme-color" content="#228B22">
  <script src="https://js.stripe.com/v3/"></script>
  <!--
    Card form for Quick Order payment links.

    WHY IT LIVES HERE: this page used to be rendered by the payment-checkout
    edge function, but Supabase's gateway serves every HTML response from
    *.supabase.co/functions/v1/* as text/plain under
    `CSP: default-src 'none'; sandbox`. That CSP blocks Stripe.js outright, so
    the page could not take a card AT ALL — the whole Quick Order payment rail
    was dead on arrival. On our own domain there is no such policy.

    SECURITY: order data arrives as JSON and is written with textContent, so a
    farm or product name containing markup is inert. The old server-rendered
    page interpolated farmName / item names / customerName straight into HTML.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #333;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .container { width: calc(100% - 24px); max-width: 480px; margin: 32px auto; background: #fff; border-radius: 12px;
                 overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
    .header { background: #2e7d32; padding: 20px; text-align: center; color: #fff;
              font-size: 20px; font-weight: 700; }
    .body { padding: 28px 24px; }
    h2 { text-align: center; margin: 0 0 4px; font-size: 18px; color: #333; }
    .sub { text-align: center; color: #666; font-size: 14px; margin: 0 0 20px; }
    .order-ref { text-align: center; background: #f5f5f5; border-radius: 8px; padding: 10px; margin-bottom: 20px; }
    .order-ref span { font-size: 18px; font-weight: 700; font-family: monospace; letter-spacing: 1px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 16px; }
    th { padding: 6px 0; text-align: left; color: #2e7d32; font-weight: 600; border-bottom: 2px solid #2e7d32; }
    td { padding: 6px 0; border-bottom: 1px solid #e8f5e9; }
    .total { text-align: right; font-size: 22px; font-weight: 700; color: #2e7d32; margin: 12px 0 24px; }
    .breakdown { margin: 12px 0 0; font-size: 14px; color: #444; }
    .breakdown-row { display: flex; justify-content: space-between; padding: 2px 0; }
    label { font-size: 13px; color: #666; display: block; margin-bottom: 8px; }
    #card-element { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 16px; background: #fff; }
    #card-errors { color: #c62828; font-size: 13px; margin-bottom: 12px; min-height: 20px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px;
           font-weight: 700; color: #fff; background: #2e7d32; cursor: pointer; }
    .btn:disabled { background: #a5d6a7; cursor: not-allowed; }
    .note { text-align: center; font-size: 12px; color: #999; margin-top: 12px; }
    .footer { background: #f5f5f5; padding: 16px 24px; text-align: center; font-size: 12px;
              color: #999; border-top: 1px solid #e0e0e0; }
    .state { text-align: center; padding: 40px 24px; }
    .state h2 { color: #2e7d32; margin-bottom: 12px; font-size: 20px; }
    .state p { color: #666; font-size: 15px; line-height: 1.5; margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Growing Green Market</div>

    <div class="state" id="loading"><p>Loading your order…</p></div>

    <div class="body" id="form" hidden>
      <h2>Complete your order</h2>
      <p class="sub" id="farm-line"></p>
      <div class="order-ref"><span id="order-ref"></span></div>
      <table>
        <thead><tr><th>Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Price</th></tr></thead>
        <tbody id="items"></tbody>
      </table>
      <!--
        Both fee rows are hidden until the payload actually carries them, so a
        payload with neither (a legacy Quick Order, a wholesale pickup order)
        renders exactly as it did before the delivery fee existed.
      -->
      <div class="breakdown" id="breakdown" hidden>
        <div class="breakdown-row"><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="breakdown-row" id="service-fee-row" hidden><span>Service fee</span><span id="service-fee"></span></div>
        <div class="breakdown-row" id="delivery-row" hidden><span id="delivery-label">Delivery fee</span><span id="delivery-fee"></span></div>
      </div>
      <div class="total" id="total"></div>
      <label for="card-element">Card details</label>
      <div id="card-element"></div>
      <div id="card-errors" role="alert"></div>
      <button class="btn" id="pay-btn" type="button">Save my card</button>
      <p class="note" id="note"></p>
    </div>

    <!--
      "Card saved", NOT "Payment confirmed". Nothing is charged on this page —
      it confirms a SetupIntent, which stores the card. The charge happens
      later, at Pick & Capture, for the amount actually picked.
      Saying "Payment confirmed" here made the real charge look like a SECOND
      one (founder report 2026-08-02); Stripe only ever had the one.
    -->
    <div class="state" id="done" hidden>
      <div style="font-size:48px;margin-bottom:16px">💳</div>
      <h2>Card saved</h2>
      <p id="done-body"></p>
    </div>

    <div class="state" id="oops" hidden>
      <div style="font-size:48px;margin-bottom:16px">⚠️</div>
      <h2 id="oops-title">Something went wrong</h2>
      <p id="oops-body"></p>
    </div>

    <div class="footer">Growing Green Market · Supporting local farmers</div>
  </div>

  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function show(id) {
      ['loading','form','done','oops'].forEach(function (k) { $(k).hidden = (k !== id); });
    }
    function fail(title, body) {
      $('oops-title').textContent = title;
      $('oops-body').textContent = body;
      show('oops');
    }
    function money(cents) { return '$' + ((cents || 0) / 100).toFixed(2); }

    var q = new URLSearchParams(window.location.search);
    var secret = q.get('secret');
    var orderId = q.get('order');
    var api = q.get('api');

    // The API base travels in the link so one static page serves both of our
    // environments. It is pinned to an EXACT list of our own projects.
    //
    // ⚠️ DO NOT relax this to a pattern like /\.supabase\.co$/. Anyone can
    // create a free Supabase project on that domain; a wildcard would let an
    // attacker craft .../pay?api=https://theirs.supabase.co and have this page
    // — on the real growinggreen.app origin, under our header, with a valid
    // padlock — mount a live card field against THEIR publishable key and
    // Stripe account, saving the victim's card to them. Stripe publishable
    // keys are not origin-restricted, so nothing downstream would catch it.
    // Caught in review before any customer saw a payment link.
    var API_ALLOWED = [
      'https://zorrzpdfequbymjgocga.supabase.co', // production
      'https://atocyakoajynffvpeyis.supabase.co'  // staging
    ];
    var apiOk = false;
    try {
      var u = new URL(api);
      // Compare the normalised origin, so a userinfo@, port, path or casing
      // trick cannot smuggle a different host past a string compare.
      apiOk = API_ALLOWED.indexOf(u.origin) !== -1;
    } catch (e) { apiOk = false; }

    if (!secret || !orderId || !apiOk) {
      fail('That link isn’t valid', 'It may be incomplete or expired. Use the link from your email, or contact the farm.');
      return;
    }

    var endpoint = new URL('/functions/v1/payment-checkout', api);
    endpoint.searchParams.set('order', orderId);
    endpoint.searchParams.set('format', 'json');
    // Prove we hold the SetupIntent secret from the emailed link. The order id
    // alone used to be enough, which made order details readable to anyone who
    // learned an id (audit 2026-08-01). Deploy this page BEFORE the function
    // that starts requiring it, or in-flight links break.
    endpoint.searchParams.set('secret', secret);

    fetch(endpoint.toString(), { headers: { accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.ok !== true) {
          var codes = {
            not_found:  ['Order not found', 'We couldn’t find this order. It may have been cancelled.'],
            cancelled:  ['Order cancelled', 'This order has been cancelled — no payment is needed.'],
            already:    ['Already confirmed', 'Your card is already saved for this order. Nothing further to do.'],
            unavailable:['Payment unavailable', 'This farm isn’t set up to take card payments yet. Contact them to arrange payment.']
          };
          var c = codes[d && d.code] || ['Something went wrong', 'Please try the link again, or contact the farm.'];
          if (d && d.code === 'already') { $('done-body').textContent = c[1]; show('done'); return; }
          fail(c[0], c[1]);
          return;
        }
        render(d);
      })
      .catch(function () {
        fail('We couldn’t load your order', 'Check your connection and try the link again.');
      });

    function render(d) {
      // Every value below is written as TEXT — a farm or product name
      // containing markup is displayed, never executed.
      $('farm-line').textContent = 'Order from ' + (d.farmName || 'your farm');
      $('order-ref').textContent = '#' + (d.orderRef || '');
      // Fee transparency (2026-08-31; farmer delivery fee added 2026-09-05).
      // The item rows sum to the PRODUCT subtotal while the total also carries
      // the buyer service fee AND the farm's delivery fee — without the
      // breakdown the math visibly doesn't add up on the one page where the
      // buyer authorizes their card. Gating the whole block on the service fee
      // meant a wholesale order (service-fee exempt, so always 0) disclosed its
      // delivery fee NOWHERE on this page.
      var fee = d.serviceFeeCents || 0;
      // Delivery is decided by PRESENCE of the key, mirroring the
      // orders.delivery_fee_cents stamp that payment-checkout reads:
      //   absent → not a delivery order (pickup, or a farm that does not offer
      //            wholesale delivery). Print nothing.
      //   0      → delivered with the fee waived. This DOES print a row; a 0
      //            must never be shown as "this farm doesn't deliver".
      //   > 0    → the fee the buyer is consenting to by saving their card.
      var hasDelivery = d.deliveryFeeCents !== undefined && d.deliveryFeeCents !== null;
      var deliveryFee = hasDelivery ? Math.max(0, Number(d.deliveryFeeCents) || 0) : 0;
      if (fee > 0 || hasDelivery) {
        // The SERVER owns every figure here. This page used to derive the
        // subtotal as total − service fee, which over-states it by the whole
        // delivery fee on a delivery order; payment-checkout now sends
        // subtotalCents outright. The subtraction survives only as a fallback
        // for a payload from an older deployed function (deploy skew), where
        // there is no delivery fee to be wrong about.
        var subtotal = (typeof d.subtotalCents === 'number')
          ? Math.max(0, d.subtotalCents)
          : Math.max(0, (d.totalCents || 0) - fee - deliveryFee);
        $('subtotal').textContent = money(subtotal);
        if (fee > 0) {
          $('service-fee').textContent = money(fee);
          $('service-fee-row').hidden = false;
        }
        if (hasDelivery) {
          // Same two shapes as the emails, so the page and the mail agree.
          $('delivery-label').textContent = deliveryFee > 0 ? 'Delivery fee' : 'Delivery';
          $('delivery-fee').textContent = deliveryFee > 0 ? money(deliveryFee) : 'Free';
          $('delivery-row').hidden = false;
        }
        $('breakdown').hidden = false;
      }
      $('total').textContent = money(d.totalCents);
      // Same delivery signal as the fee row above (payment-checkout sends
      // fulfillmentMethod alongside it), so this page says what the payment
      // email that linked here says — "ready for delivery" on a delivery
      // order, and the byte-identical pre-P8 sentence on every other one.
      $('note').textContent =
        'Your card will not be charged now. It is charged when ' +
        (d.farmName || 'the farm') +
        (hasDelivery
          ? ' confirms your order is ready for delivery.'
          : ' confirms your order is ready.');
      $('done-body').textContent =
        'Your card is saved — you have not been charged yet. ' +
        (d.farmName || 'The farm') +
        ' will charge it when your order is picked, for what is actually ' +
        'picked, and you will get a receipt then.';

      var tbody = $('items');
      (d.items || []).forEach(function (it) {
        var tr = document.createElement('tr');
        var name = document.createElement('td');
        name.textContent = it.name || 'Item';
        var qty = document.createElement('td');
        qty.style.textAlign = 'center';
        qty.textContent = String(it.qty == null ? 1 : it.qty);
        var price = document.createElement('td');
        price.style.textAlign = 'right';
        price.textContent = money(it.priceCents);
        tr.appendChild(name); tr.appendChild(qty); tr.appendChild(price);
        tbody.appendChild(tr);
      });

      var btn = $('pay-btn');
      btn.textContent = 'Save my card';

      var stripe = Stripe(d.pk, { stripeAccount: d.stripeAccount });
      var card = stripe.elements().create('card', { style: { base: { fontSize: '16px' } } });
      card.mount('#card-element');
      card.on('change', function (e) {
        $('card-errors').textContent = e.error ? e.error.message : '';
      });

      btn.addEventListener('click', function () {
        btn.disabled = true;
        btn.textContent = 'Processing…';
        stripe.confirmCardSetup(secret, {
          payment_method: { card: card, billing_details: { name: d.customerName || undefined } }
        }).then(function (res) {
          if (res.error) {
            $('card-errors').textContent = res.error.message;
            btn.disabled = false;
            btn.textContent = 'Save my card';
            return;
          }
          show('done');
        });
      });

      show('form');
    }
  })();
  </script>
</body>
</html>
